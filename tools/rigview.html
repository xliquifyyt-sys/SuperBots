<!doctype html>
<meta charset="utf-8">
<title>Rig viewer</title>
<base href="../">
<style>body{margin:0;background:#1b1f28;color:#e7ebf4;font:14px system-ui}canvas{display:block}#bar{padding:8px 12px;display:flex;gap:12px;align-items:center}</style>
<div id="bar"><label>Bot <select id="bot"></select></label><label>t <input id="t" type="range" min="0" max="1" step="0.01" value="0.35"></label><span id="tv">0.35</span><label><input id="play" type="checkbox" checked> play</label></div>
<canvas id="c" width="1600" height="1000"></canvas>
<script type="module">
import { drawBot } from './src/render/bots.js';
import { loadSprites } from './src/render/sprites.js';
import { BOTS, BOT_IDS } from './src/core/defs.js';
const c = document.getElementById('c'), ctx = c.getContext('2d');
const sel = document.getElementById('bot'); for (const id of BOT_IDS) { const o = document.createElement('option'); o.value = id; o.textContent = id; sel.appendChild(o); }
sel.value = new URLSearchParams(location.search).get('bot') || 'volt';
loadSprites();
const STATES = ['idle', 'fire', 's1', 's2', 'jump', 'land', 'hit', 'death'];
let time = 0, last = performance.now();
function frame(now) {
  const dt = (now - last) / 1000; last = now; if (document.getElementById('play').checked) time += dt;
  const def = BOTS[sel.value];
  const tv = +document.getElementById('t').value; document.getElementById('tv').textContent = tv.toFixed(2);
  ctx.fillStyle = '#1b1f28'; ctx.fillRect(0, 0, c.width, c.height);
  STATES.forEach((anim, i) => {
    const col = i % 4, row = Math.floor(i / 4);
    const x = 200 + col * 400, y = 260 + row * 480;
    const t = document.getElementById('play').checked ? (time * 0.9 + i * 0.13) % 1 : tv;
    ctx.strokeStyle = '#2a3245'; ctx.beginPath(); ctx.moveTo(x - 180, y + 78); ctx.lineTo(x + 180, y + 78); ctx.stroke();
    ctx.fillStyle = '#8f99ad'; ctx.font = 'bold 18px system-ui'; ctx.fillText(`${anim}  t=${t.toFixed(2)}`, x - 180, y - 170);
    ctx.save(); ctx.translate(x, y);
    drawBot(ctx, def, 100, { anim, t, facing: 1, vx: 0, vy: 0, grounded: anim !== 'jump', color: def.color, hp: 1, id: 0 }, time);
    ctx.restore();
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__rigReady = true;
</script>
